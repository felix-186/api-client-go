// protoc -I ./ --go_out=. ./flow/flow.proto
// protoc -I ./ --go-grpc_out=. flow/flow.proto

syntax = "proto3";

package flow;

import "api/api.proto";
import "google/protobuf/empty.proto";

option go_package = "./flow;flow";
option java_package = "cn.gtsiot.sdk.client.dubbo.grpc.flow";
option java_multiple_files = true;
option java_generate_equals_and_hash = true;
option java_generic_services = true;

service FlowTaskService {
  rpc Create (api.CreateRequest) returns (api.Response) {}
  rpc Get (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Query (api.QueryRequest) returns (api.Response) {}
  rpc BatchCreate (api.CreateRequest) returns (api.Response) {}
  rpc Update (api.UpdateRequest) returns (api.Response) {}
  rpc RevertCreate (api.CreateRequest) returns (api.Response) {}
  rpc Delete (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Replace (api.UpdateRequest) returns (api.Response) {}
  rpc UpdateFilter (api.UpdateFilter) returns (api.Response) {}
}

service FlowService {
  rpc Query (api.QueryRequest) returns (api.Response) {}
  rpc Get (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Update (api.UpdateRequest) returns (api.Response) {}
  rpc BatchCreate (api.CreateRequest) returns (api.Response) {}
  rpc Delete (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Replace (api.UpdateRequest) returns (api.Response) {}
}

service EngineService {
  rpc Run (RunRequest) returns (RunResponse) {}
  rpc Resume (ResumeRequest) returns (google.protobuf.Empty) {}
  rpc Revert (ResumeRequest) returns (google.protobuf.Empty) {}
  rpc Recall (ResumeRequest) returns (google.protobuf.Empty) {}
  rpc Fail (FailRequest) returns (google.protobuf.Empty) {}
}

service PluginService {
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse) {}
  rpc Register (stream FlowResponse) returns (stream FlowRequest){}
  rpc DebugStream (stream DebugResponse) returns (stream DebugRequest){}
}

service ExtensionService {
  rpc HealthCheck (ExtensionHealthCheckRequest) returns (ExtensionHealthCheckResponse) {}
  rpc SchemaStream (stream ExtensionResult) returns (stream ExtensionSchemaRequest) {}
  rpc RunStream (stream ExtensionResult) returns (stream ExtensionRunRequest) {}
}

service FlowJobCronService {
  rpc Query (api.QueryRequest) returns (api.Response) {}
  rpc Get (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Delete (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Update (api.UpdateRequest) returns (api.Response) {}
  rpc Replace (api.UpdateRequest) returns (api.Response) {}
  rpc Create (api.CreateRequest) returns (api.Response) {}
  rpc CreateMany (api.CreateRequest) returns (api.Response) {}
  rpc DeleteMany (api.QueryRequest) returns (api.Response) {}
}

service FlowLogCronService {
  rpc Query (api.QueryRequest) returns (api.Response) {}
  rpc Get (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Delete (api.GetOrDeleteRequest) returns (api.Response) {}
  rpc Update (api.UpdateRequest) returns (api.Response) {}
  rpc Create (api.CreateRequest) returns (api.Response) {}
  rpc CreateMany (api.CreateRequest) returns (api.Response) {}
  rpc DeleteMany (api.QueryRequest) returns (api.Response) {}
}

message RunRequest {
  string projectId = 1;
  string config = 2;
  bytes element = 3;
  bytes variables = 4;
}

message RunResponse {
  string job = 1;
}

message ResumeRequest {
  string projectId = 1;
  string jobId = 2;
  string elementId = 3;
  bytes variables = 4;
}

message FailRequest {
  string projectId = 1;
  string jobId = 2;
  string elementId = 3;
  string errorMessage = 4;
}

message HealthCheckRequest {
  string name = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
  repeated Error errors = 2;
}

message Error {
  enum ErrorCode {
    Register = 0;
  }
  ErrorCode code = 1;
  string message = 2;
}

message FlowRequest{
  string projectId = 1;
  string flowId = 2;
  string job = 3;
  string elementId = 4;
  string elementJob = 5;
  bytes config = 6;
}

message FlowResponse{
  string elementJob = 1;
  bool status = 2;
  string info = 3;
  string detail = 4;
  bytes result = 5;
}

message DebugRequest{
  string projectId = 1;
  string flowId = 2;
  string elementId = 3;
  string elementJob = 5;
  bytes config = 6;
}

message DebugResponse{
  string elementJob = 1;
  bool status = 2;
  string info = 3;
  string detail = 4;
  bytes result = 5;
}

message ExtensionHealthCheckRequest {
  string id = 1;
}

message ExtensionHealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
  repeated ExtensionError errors = 2;
}

message ExtensionError {
  enum ErrorCode {
    Schema = 0;
    Run = 1;
  }
  ErrorCode code = 1;
  string message = 2;
}

message ExtensionSchemaRequest {
  string request = 1;
  string locale = 2;
}

message ExtensionRunRequest {
  string request = 1;
  bytes data = 2;
}

message ExtensionResult {
  string request = 1;
  bool status = 2;
  string info = 3;
  string detail = 4;
  bytes result = 5;
}
